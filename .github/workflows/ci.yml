name: Python Automation Test CI

on: [push]

jobs:
  test-my-python-code:
    runs-on: ubuntu-latest

    steps:
      # 1. Tomar code ta GitHub-er virtual machine-e anbe
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Python install korbe
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. Dorkari package gulo install korbe
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest selenium

      # 4. Tomar asol test gulo run korbe
      - name: Run Pytest
        run: pytest